    <style>
        :root {
            --bg-primary: #0d0f12;
            --bg-secondary: #16191e;
            --bg-tertiary: #1e2229;
            --border-color: #2a2f3a;
            --text-main: #ececec;
            --text-muted: #8e95a5;
            --accent-green: #38d39f;
            --accent-glow: rgba(56, 211, 159, 0.25);
            --blunt-amber: #ff7b00;
            --smoke-white: rgba(220, 235, 225, 0.7);
            --sidebar-width: 260px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar Styling */
        .sidebar {
            width: var(--sidebar-width);
            background-color: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 12px;
            z-index: 10;
        }

        .new-chat-btn {
            background-color: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px 14px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .new-chat-btn:hover {
            background-color: var(--bg-tertiary);
            border-color: var(--accent-green);
        }

        .chat-history {
            flex: 1;
            margin-top: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .history-item {
            padding: 10px 12px;
            border-radius: 6px;
            color: var(--text-muted);
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .history-item:hover {
            background-color: var(--bg-tertiary);
            color: var(--text-main);
        }

        .user-profile {
            border-top: 1px solid var(--border-color);
            padding-top: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, #2d5a3f, #1b3a27);
            border: 1px solid var(--accent-green);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: var(--accent-green);
        }

        /* Main Workspace */
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            background: radial-gradient(circle at center, #13171f 0%, #0d0f12 100%);
        }

        .viewport-hero {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* Stage Container for Orbit & Groot Visual */
        .stage {
            position: relative;
            width: 500px;
            height: 500px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Central Cannabis Groot Artwork Structure */
        .groot-wrapper {
            position: relative;
            width: 240px;
            height: 320px;
            z-index: 2;
            filter: drop-shadow(0 0 25px rgba(56, 211, 159, 0.15));
        }

        /* Animated SVG Cannabis Female Figure */
        .groot-svg {
            width: 100%;
            height: 100%;
        }

        /* Blunt & Smoke Emitter */
        .blunt-tip {
            animation: cherryGlow 2.5s infinite alternate ease-in-out;
        }

        @keyframes cherryGlow {
            0% { fill: #ff4500; filter: drop-shadow(0 0 2px #ff4500); }
            100% { fill: #ffaa00; filter: drop-shadow(0 0 10px #ffaa00); }
        }

        /* Puff Stream Animation */
        .smoke-puff {
            position: absolute;
            top: 45%;
            left: 58%;
            width: 12px;
            height: 12px;
            background: var(--smoke-white);
            border-radius: 50%;
            filter: blur(4px);
            opacity: 0;
            animation: riseAndExpand 4s infinite ease-out;
        }

        @keyframes riseAndExpand {
            0% {
                transform: translate(0, 0) scale(0.5);
                opacity: 0.8;
            }
            50% {
                opacity: 0.5;
            }
            100% {
                transform: translate(-60px, -120px) scale(3.5);
                opacity: 0;
            }
        }

        /* Orbiting System */
        .orbit-system {
            position: absolute;
            width: 440px;
            height: 440px;
            border-radius: 50%;
            border: 1px stroke rgba(56, 211, 159, 0.1);
            animation: rotateOrbit 35s linear infinite;
            transform-style: preserve-3d;
        }

        @keyframes rotateOrbit {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .orbit-node {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 68px;
            height: 68px;
            margin-top: -34px;
            margin-left: -34px;
            border-radius: 50%;
            background: rgba(22, 25, 30, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(56, 211, 159, 0.4);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5), inset 0 0 10px var(--accent-glow);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            color: var(--text-main);
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .node-counter-rotate {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            animation: counterRotate 35s linear infinite;
        }

        @keyframes counterRotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(-360deg); }
        }

        .orbit-node:hover {
            border-color: var(--accent-green);
            box-shadow: 0 0 20px var(--accent-green);
            scale: 1.15;
            background: rgba(30, 34, 41, 0.95);
        }

        .orbit-node span {
            font-size: 9px;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: var(--accent-green);
            text-transform: uppercase;
        }

        /* Positioning Nodes Along Circular Path (7 Icons = 360/7 ≈ 51.4 deg) */
        .node-1 { transform: rotate(0deg) translate(210px); }
        .node-2 { transform: rotate(51.4deg) translate(210px); }
        .node-3 { transform: rotate(102.8deg) translate(210px); }
        .node-4 { transform: rotate(154.2deg) translate(210px); }
        .node-5 { transform: rotate(205.6deg) translate(210px); }
        .node-6 { transform: rotate(257deg) translate(210px); }
        .node-7 { transform: rotate(308.4deg) translate(210px); }

        /* Input Dock Area */
        .input-container {
            width: 100%;
            max-width: 760px;
            margin: 0 auto 30px auto;
            padding: 0 20px;
        }

        .input-box {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.3);
            transition: border-color 0.2s ease;
        }

        .input-box:focus-within {
            border-color: var(--accent-green);
        }

        .input-box textarea {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-main);
            font-size: 15px;
            resize: none;
            height: 24px;
            max-height: 150px;
        }

        .send-btn {
            background-color: var(--accent-green);
            border: none;
            border-radius: 8px;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--bg-primary);
            cursor: pointer;
            transition: opacity 0.2s ease;
        }

        .send-btn:hover {
            opacity: 0.85;
        }
    </style>

<body>

            <button class="new-chat-btn">
                <i data-lucide="plus" style="width: 18px;"></i>
                New Chat

            <div class="chat-history">
                <div class="history-item"><i data-lucide="message-square" style="width: 16px;"></i> Hydroponic Strain Profiles</div>
                <div class="history-item"><i data-lucide="message-square" style="width: 16px;"></i> Legal Compliance Checklist</div>

            <div class="stage">
                
                <div class="groot-wrapper">

                        <path d="M85,50 Q60,20 45,25 Q65,45 80,55 Z" fill="#52b788"/>
                        <path d="M120,60 Q150,40 170,50 Q145,65 125,70 Z" fill="#40916c"/>

                <div class="smoke-puff"></div>

                    <a href="#ai" class="orbit-node node-2">
                        <div class="node-counter-rotate">

                    <a href="#strain-creation" class="orbit-node node-3">
                        <div class="node-counter-rotate">

                    <a href="#e-commerce" class="orbit-node node-4">

        <div class="input-container">
            <div class="input-box">
                <i data-lucide="paperclip" style="color: var(--text-muted); cursor: pointer;"></i>

                <button class="send-btn">
                    <i data-lucide="arrow-up" style="width: 18px;"></i>
                </button>
            </div>
        </div>
    </main>

    <script>
        // Initialize Icons
        lucide.createIcons();

        // Auto-expanding textarea
        const tx = document.getElementsByTagName("textarea")[0];
        tx.addEventListener("input", OnInput, false);

        function OnInput() {
            this.style.height = "auto";
            this.style.height = (this.scrollHeight - 16) + "px";
        }
    </script>
