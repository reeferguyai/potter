<style>
:root {
  --bg-primary: #0d0f12;
  --bg-secondary: #16191e;
  --bg-tertiary: #1e2229;
  --border-color: #2a2f3a;
  --text-main: #ececec;
  --text-muted: #8e95a5;
  --accent-green: #38d39f;
  --accent-glow: rgba(56, 211, 159, 0.25);
  --blunt-amber: #ff7b00;
  --smoke-white: rgba(220, 235, 225, 0.7);
  --sidebar-width: 260px;
  --focus-ring: 0 0 0 3px rgba(56, 211, 159, 0.45);
}
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}
html {
  background-color: var(--bg-primary);
  scroll-behavior: smooth;
  -webkit-text-size-adjust: 100%;
}
body {
  font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background-color: var(--bg-primary);
  color: var(--text-main);
  display: flex;
  min-height: 100vh;
  min-height: 100dvh;
  overflow: hidden;
  line-height: 1.5;
}
a {
  -webkit-tap-highlight-color: transparent;
  color: inherit;
  text-decoration: none;
}
button, textarea {
  -webkit-tap-highlight-color: transparent;
  font-family: inherit;
}
:focus-visible {
  outline: none;
  box-shadow: var(--focus-ring);
}
.skip-link {
  position: absolute;
  top: -100px;
  left: 16px;
  background: var(--accent-green);
  color: var(--bg-primary);
  padding: 12px 18px;
  border-radius: 8px;
  font-weight: 600;
  z-index: 1000;
  transition: top 0.2s ease;
}
.skip-link:focus {
  top: 16px;
}
.sidebar {
  width: var(--sidebar-width);
  background-color: var(--bg-secondary);
  border-right: 1px solid var(--border-color);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 12px;
  z-index: 10;
  flex-shrink: 0;
}
.mobile-nav-toggle {
  display: none;
  position: fixed;
  top: 14px;
  left: 14px;
  z-index: 30;
  background: var(--bg-secondary);
  border: 1px solid var(--border-color);
  color: var(--text-main);
  width: 44px;
  height: 44px;
  border-radius: 10px;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}
.new-chat-btn {
  background-color: transparent;
  border: 1px solid var(--border-color);
  color: var(--text-main);
  padding: 10px 14px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  font-weight: 500;
  width: 100%;
  transition: background-color 0.2s ease, border-color 0.2s ease;
}
.new-chat-btn:hover,
.new-chat-btn:focus-visible {
  background-color: var(--bg-tertiary);
  border-color: var(--accent-green);
}
.chat-history {
  flex: 1;
  margin-top: 20px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 6px;
  -webkit-overflow-scrolling: touch;
}
.history-item {
  padding: 10px 12px;
  border-radius: 6px;
  color: var(--text-muted);
  font-size: 14px;
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  border: none;
  background: transparent;
  text-align: left;
  width: 100%;
  transition: background-color 0.15s ease, color 0.15s ease;
}
.history-item:hover,
.history-item:focus-visible {
  background-color: var(--bg-tertiary);
  color: var(--text-main);
}
.user-profile {
  border-top: 1px solid var(--border-color);
  padding-top: 12px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.avatar {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: linear-gradient(135deg, #2d5a3f, #1b3a27);
  border: 1px solid var(--accent-green);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  color: var(--accent-green);
  flex-shrink: 0;
}
.main-container {
  flex: 1;
  display: flex;
  flex-direction: column;
  position: relative;
  background: radial-gradient(circle at center, #13171f 0%, #0d0f12 100%);
  min-width: 0;
}
.viewport-hero {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
  padding: 20px 12px;
}
.stage {
  position: relative;
  width: min(500px, 90vw);
  height: min(500px, 90vw);
  display: flex;
  align-items: center;
  justify-content: center;
}
.groot-wrapper {
  position: relative;
  width: 48%;
  height: 64%;
  z-index: 2;
  filter: drop-shadow(0 0 25px rgba(56, 211, 159, 0.15));
}
.groot-svg {
  width: 100%;
  height: 100%;
}
.blunt-tip {
  animation: cherryGlow 2.5s infinite alternate ease-in-out;
}
@keyframes cherryGlow {
  0% { fill: #ff4500; filter: drop-shadow(0 0 2px #ff4500); }
  100% { fill: #ffaa00; filter: drop-shadow(0 0 10px #ffaa00); }
}
.smoke-puff {
  position: absolute;
  top: 45%;
  left: 58%;
  width: 12px;
  height: 12px;
  background: var(--smoke-white);
  border-radius: 50%;
  filter: blur(4px);
  opacity: 0;
  animation: riseAndExpand 4s infinite ease-out;
  pointer-events: none;
}
@keyframes riseAndExpand {
  0% { transform: translate(0, 0) scale(0.5); opacity: 0.8; }
  50% { opacity: 0.5; }
  100% { transform: translate(-60px, -120px) scale(3.5); opacity: 0; }
}
.orbit-system {
  position: absolute;
  width: 88%;
  height: 88%;
  border-radius: 50%;
  border: 1px solid rgba(56, 211, 159, 0.1);
  animation: rotateOrbit 35s linear infinite;
}
@keyframes rotateOrbit {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}
.orbit-node {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 68px;
  height: 68px;
  margin-top: -34px;
  margin-left: -34px;
  border-radius: 50%;
  background: rgba(22, 25, 30, 0.85);
  backdrop-filter: blur(8px);
  border: 1px solid rgba(56, 211, 159, 0.4);
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5), inset 0 0 10px var(--accent-glow);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  color: var(--text-main);
  cursor: pointer;
  transition: border-color 0.3s ease, box-shadow 0.3s ease, transform 0.3s ease, background-color 0.3s ease;
}
.node-counter-rotate {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  animation: counterRotate 35s linear infinite;
}
@keyframes counterRotate {
  from { transform: rotate(0deg); }
  to { transform: rotate(-360deg); }
}
.orbit-node:hover,
.orbit-node:focus-visible {
  border-color: var(--accent-green);
  box-shadow: 0 0 20px var(--accent-green);
  transform: scale(1.15);
  background: rgba(30, 34, 41, 0.95);
}
.orbit-node span {
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 0.5px;
  color: var(--accent-green);
  text-transform: uppercase;
}
.node-1 { transform: rotate(0deg) translate(min(210px, 42vw)); }
.node-2 { transform: rotate(51.4deg) translate(min(210px, 42vw)); }
.node-3 { transform: rotate(102.8deg) translate(min(210px, 42vw)); }
.node-4 { transform: rotate(154.2deg) translate(min(210px, 42vw)); }
.node-5 { transform: rotate(205.6deg) translate(min(210px, 42vw)); }
.node-6 { transform: rotate(257deg) translate(min(210px, 42vw)); }
.node-7 { transform: rotate(308.4deg) translate(min(210px, 42vw)); }
.input-container {
  width: 100%;
  max-width: 760px;
  margin: 0 auto 30px auto;
  padding: 0 20px;
}
.input-box {
  background-color: var(--bg-secondary);
  border: 1px solid var(--border-color);
  border-radius: 16px;
  padding: 12px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
  transition: border-color 0.2s ease;
}
.input-box:focus-within {
  border-color: var(--accent-green);
}
.input-box textarea {
  flex: 1;
  background: transparent;
  border: none;
  outline: none;
  color: var(--text-main);
  font-size: 15px;
  resize: none;
  height: 24px;
  max-height: 150px;
  line-height: 1.4;
}
.send-btn {
  background-color: var(--accent-green);
  border: none;
  border-radius: 8px;
  width: 36px;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--bg-primary);
  cursor: pointer;
  transition: opacity 0.2s ease;
  flex-shrink: 0;
}
.send-btn:hover,
.send-btn:focus-visible {
  opacity: 0.85;
}
.send-btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}
.visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}
@media (max-width: 900px) {
  :root { --sidebar-width: 220px; }
  .stage { transform: scale(0.9); }
  .input-container { max-width: 95%; }
}
@media (max-width: 700px) {
  body { overflow-x: hidden; }
  .sidebar {
    position: fixed;
    top: 0;
    left: 0;
    height: 100%;
    height: 100dvh;
    transform: translateX(-100%);
    transition: transform 0.3s ease;
    z-index: 40;
    box-shadow: 8px 0 30px rgba(0, 0, 0, 0.4);
  }
  .sidebar.is-open {
    transform: translateX(0);
  }
  .mobile-nav-toggle {
    display: flex;
  }
  .stage {
    width: min(430px, 92vw);
    height: min(430px, 92vw);
  }
  .input-container {
    margin-bottom: 18px;
    padding: 0 12px;
  }
  .input-box {
    border-radius: 14px;
  }
  .orbit-node {
    width: 58px;
    height: 58px;
    margin-top: -29px;
    margin-left: -29px;
  }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
  .orbit-system,
  .node-counter-rotate,
  .blunt-tip,
  .smoke-puff {
    animation: none !important;
  }
}
</style>

<script>
(function () {
  "use strict";
  window.PotGrowHub = window.PotGrowHub || {};

    domain: "potgrowhub.store",
    canonicalUrl: "https://potgrowhub.store/",
    wwwUrl: "https://www.potgrowhub.store/",

    authUrl: "https://auth.potgrowhub.store/",
    cdnUrl: "https://cdn.potgrowhub.store/",
    environment: "production",
    protocol: "https:",
    hostname: window.location.hostname,
    port: window.location.port || "443",
    locale: "en-US",
    timezone: "America/New_York",
    currency: "USD"
  };
  if (window.location.protocol !== "https:" && window.location.hostname === "potgrowhub.store") {
    window.location.replace("https://potgrowhub.store" + window.location.pathname + window.location.search + window.location.hash);
  }
  if (window.location.hostname === "www.potgrowhub.store") {
    window.location.replace("https://potgrowhub.store" + window.location.pathname + window.location.search + window.location.hash);
  }
  var tx = document.getElementById("chat-input");
  if (tx) {
    tx.addEventListener("input", function () {
      this.style.height = "auto";
      this.style.height = Math.min(this.scrollHeight, 150) + "px";
    });
  }
  var toggle = document.getElementById("mobile-nav-toggle");
  var sidebar = document.getElementById("sidebar");
  if (toggle && sidebar) {
    toggle.addEventListener("click", function () {
      var open = sidebar.classList.toggle("is-open");
      toggle.setAttribute("aria-expanded", open ? "true" : "false");
      toggle.setAttribute("aria-label", open ? "Close navigation menu" : "Open navigation menu");
    });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && sidebar.classList.contains("is-open")) {
        sidebar.classList.remove("is-open");
        toggle.setAttribute("aria-expanded", "false");
        toggle.setAttribute("aria-label", "Open navigation menu");
        toggle.focus();
      }
    });
  }
  var form = document.getElementById("chat-form");
  if (form) {
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      var val = tx && tx.value.trim();
      if (!val) return;
      if (typeof gtag === "function") {
        gtag("event", "search", { search_term: val });
      }
      window.location.href = "/search?q=" + encodeURIComponent(val);
    });
  }
})();
</script>
