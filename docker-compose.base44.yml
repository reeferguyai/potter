services:
  backend:
    image: node:22-slim
    working_dir: /repo/backend
    command: sh -c "npm install --omit=dev && node --watch server/index.js"
    volumes:
      - ./:/repo
    environment:
      - PORT=8787
      - NODE_ENV=development
      - CORS_ORIGIN=*
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    depends_on: []
    restart: unless-stopped

  web:
    image: nginx:alpine
    ports:
      - "3000:3000"
    volumes:
      - ./:/app:ro
      - ./.base44/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    restart: unless-stopped
